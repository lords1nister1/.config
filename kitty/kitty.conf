# Configuration based on:
# https://github.com/kovidgoyal/kitty-themes/blob/master/themes/GitHub_Dark.conf
# Adjusted by me
#
# You can find the normal configuration (without the color scheme(s)) at:
# https://github.com/lords1nister1/.config/blob/b53b27e21fa47da0250d998ad3fc86f0b8af4711/kitty/kitty.conf

font_family                 JetBrainsMono Nerd Font
font_size                   12
bold_font                   auto
italic_font                 auto
bold_italic_font            auto
remember_window_size        no
initial_window_width        1175
initial_window_height       525
cursor_blink_interval       0.5
cursor_stop_blinking_after  1
scrollback_lines            2000
wheel_scroll_min_lines      1
enable_audio_bell           no
window_padding_width        10
hide_window_decorations     yes
confirm_os_window_close     0
background_opacity          0.7
dynamic_background_opacity  yes


